<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘텐츠 상세 - TVING</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header scrolled">
        <div class="header-inner">
            <a href="/" class="logo"><img src="https://image.tving.com/ntgs/operation/logo/2023/09/18/1695032536_1.svg" alt="TVING" height="24"></a>
            <nav class="nav">
                <a href="/pages/contents.html?category=드라마">드라마</a>
                <a href="/pages/contents.html?category=예능">예능</a>
                <a href="/pages/contents.html?category=영화">영화</a>
                <a href="/pages/contents.html?category=애니">애니</a>
                <a href="/pages/contents.html">전체</a>
            </nav>
            <div class="auth-buttons" id="auth-buttons">
                <a href="/pages/login.html" class="btn btn-outline">로그인</a>
                <a href="/pages/register.html" class="btn btn-primary">회원가입</a>
            </div>
            <div class="user-menu" id="user-menu" style="display:none;">
                <a href="/pages/wishlist.html" style="color:#aaa;font-size:13px;">찜</a>
                <a href="/pages/history.html" style="color:#aaa;font-size:13px;">기록</a>
                <span id="user-name" style="color:#ccc;font-size:13px;"></span>
                <button class="btn btn-outline" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </header>

    <main class="content-detail">
        <div class="content-detail-header">
            <div class="content-detail-poster" id="poster">
                <img src="/images/placeholder.png" alt="포스터">
            </div>
            <div class="content-detail-info" id="detail-info">
                <h1>로딩 중...</h1>
                <div class="meta"></div>
                <div class="synopsis"></div>
                <div class="action-buttons">
                    <button class="btn btn-primary btn-lg" id="btn-watch" onclick="watchContent()">▶ 시청하기</button>
                    <button class="btn btn-outline btn-lg" id="btn-wishlist" onclick="toggleWishlist()">♥ 찜하기</button>
                </div>
            </div>
        </div>
        <div class="episode-section" id="episode-section" style="display:none;">
            <h2>에피소드</h2>
            <div class="episode-list" id="episode-list"></div>
        </div>
    </main>

    <footer class="footer">
        <p>주식회사 티빙 | CJ AI 클라우드 엔지니어 부트캠프 실습 프로젝트</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        let contentId = getQueryParam('id');
        let contentData = null;
        let isWishlisted = false;

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            if (!contentId) {
                alert('잘못된 접근입니다.');
                window.location.href = '/pages/contents.html';
                return;
            }
            loadDetail();
        });

        async function loadDetail() {
            try {
                const data = await api.get(`/api/contents/${contentId}`);
                contentData = data;
                document.title = `${data.title} - TVING`;

                document.getElementById('poster').innerHTML =
                    `<img src="${data.thumbnail_url || data.poster || data.thumbnail || ''}" alt="${data.title}" onerror="this.style.display='none'">`;

                const info = document.getElementById('detail-info');
                info.querySelector('h1').textContent = data.title;
                info.querySelector('.meta').innerHTML = [
                    data.category,
                    data.year || data.release_year,
                    data.rating
                ].filter(Boolean).map(m => `<span>${m}</span>`).join('');
                info.querySelector('.synopsis').textContent = data.synopsis || data.description || '';

                // 에피소드 표시
                if (data.episodes && data.episodes.length > 0) {
                    document.getElementById('episode-section').style.display = 'block';
                    document.getElementById('episode-list').innerHTML = data.episodes.map(ep => `
                        <div class="episode-card" onclick="playEpisode(${ep.episode_number || ep.number})">
                            <span class="episode-number">${ep.episode_number || ep.number}</span>
                            <span class="episode-title">${ep.title || '에피소드 ' + (ep.episode_number || ep.number)}</span>
                            <span class="episode-duration">${ep.duration || ''}</span>
                        </div>
                    `).join('');
                }
            } catch (err) {
                document.querySelector('.content-detail-info h1').textContent = '콘텐츠를 불러올 수 없습니다.';
            }
        }

        function watchContent() {
            if (!requireAuth()) return;
            api.post('/api/history', {
                content_id: parseInt(contentId),
                episode_number: 1,
                watch_position: 0
            }).catch(() => {});
            alert('시청을 시작합니다.');
        }

        function playEpisode(epNum) {
            if (!requireAuth()) return;
            api.post('/api/history', {
                content_id: parseInt(contentId),
                episode_number: epNum,
                watch_position: 0
            }).catch(() => {});
            alert(`에피소드 ${epNum} 시청을 시작합니다.`);
        }

        async function toggleWishlist() {
            if (!requireAuth()) return;
            const btn = document.getElementById('btn-wishlist');
            try {
                if (isWishlisted) {
                    await api.delete(`/api/wishlist/${contentId}`);
                    isWishlisted = false;
                    btn.textContent = '♥ 찜하기';
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-outline');
                } else {
                    await api.post('/api/wishlist', { content_id: parseInt(contentId) });
                    isWishlisted = true;
                    btn.textContent = '♥ 찜 해제';
                    btn.classList.remove('btn-outline');
                    btn.classList.add('btn-primary');
                }
            } catch (err) {
                alert('처리 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
